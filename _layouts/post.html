---
layout: default
---
<article class="prose post">
  <a class="back" href="{{ '/blog' | relative_url }}">&larr; All posts</a>
  <header class="post-head">
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" }}</time>
      {% if page.categories.size > 0 %}&middot; {{ page.categories | join: ", " }}{% endif %}
    </p>
  </header>
  {{ content }}
</article>
