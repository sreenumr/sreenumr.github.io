<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">
  <div class="flex min-h-screen">

    <!-- Mobile backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/30 z-30 hidden md:hidden" onclick="toggleSidebar()"></div>

    {% include sidebar.html %}

    <main class="flex-1">
      <!-- Mobile top bar -->
      <header class="md:hidden bg-white border-b border-gray-200 px-4 py-3 flex items-center">
        <button class="mr-3 text-gray-600" onclick="toggleSidebar()" aria-label="Open menu">
          ☰
        </button>
        <span class="text-sm font-medium">
          {{ page.title }}
        </span>
      </header>

      <div class="max-w-6xl mx-auto px-6 md:px-10 py-8">
        {{ content }}
      </div>
    </main>

  </div>

  <!-- Sidebar toggle script -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const backdrop = document.getElementById("sidebar-backdrop");

      sidebar.classList.toggle("-translate-x-full");
      backdrop.classList.toggle("hidden");
    }
  </script>
</body>


</html>
